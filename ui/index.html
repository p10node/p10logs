<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>p10logs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%235cc8c1%27/%3E%3Cpath d=%27M4 5h8M4 8h8M4 11h8%27 stroke=%27%2308201e%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1216; --panel:#151a20; --panel-2:#1b2129; --line:#262e38;
  --fg:#d7dde5; --fg-muted:#8a95a3; --fg-faint:#5b6673;
  --accent:#5cc8c1; --accent-ink:#08201e;
  --live:#7bd88f; --warn:#e3b341; --err:#f0716a; --stderr:#f2a58e; --sel:rgba(92,200,193,.14);
  --p0:#7cc4ff; --p1:#f2a58e; --p2:#c9a7ff; --p3:#8fe3a8; --p4:#ffd47a; --p5:#ff9ad5;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f5f7; --panel:#ffffff; --panel-2:#eaeef2; --line:#d5dbe2;
    --fg:#1c2128; --fg-muted:#5b6673; --fg-faint:#8a95a3; --accent:#0f8b84; --accent-ink:#ffffff;
    --live:#1f8f4a; --warn:#8f6400; --err:#c8362e; --stderr:#b5482f; --sel:rgba(15,139,132,.12);
    --p0:#1f6fc2; --p1:#b5482f; --p2:#6f3fc7; --p3:#1f8f4a; --p4:#8f6400; --p5:#b8368f; color-scheme:light;
  }
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--ui);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important} /* author display rules (.empty is display:grid) must not defeat the hidden attribute */
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:grid;grid-template-rows:44px 1fr;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.brand .mark{width:18px;height:18px;border-radius:4px;background:var(--accent);position:relative}
.brand .mark::after{content:"";position:absolute;left:4px;right:4px;top:5px;height:2px;background:var(--accent-ink);box-shadow:0 4px 0 var(--accent-ink),0 8px 0 var(--accent-ink)}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{background:none;border:0;padding:6px 10px;border-radius:6px;color:var(--fg-muted)}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--fg)}
.grow{flex:1}
.hubpill{display:flex;align-items:center;gap:6px;color:var(--fg-muted);font-family:var(--mono);font-size:11.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);display:inline-block}
.dot.bad{background:var(--err)}
.menubtn{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.shell{display:grid;grid-template-columns:280px 1fr;min-height:0}
.shell.full{grid-template-columns:1fr} /* agents tab: no stream tree, main takes the whole width */
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side .find{padding:8px;border-bottom:1px solid var(--line);display:flex;gap:6px}
.find input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.side .tools{display:flex;gap:4px;padding:6px 8px 4px;align-items:center;flex-wrap:wrap}
.btn.sm{padding:2px 7px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:default}
.tools select{background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:3px 4px;font-size:11.5px;flex:1;min-width:0}
.chips{display:flex;gap:4px;padding:2px 8px 8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.chips button{background:none;border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11px;color:var(--fg-muted)}
.chips button[aria-pressed="true"]{background:var(--sel);color:var(--accent);border-color:var(--accent)}
.node.wl{padding-left:32px;color:var(--fg)}
.node.wl.part .nm{color:var(--accent)}
.node .kd{font-size:9.5px;color:var(--fg-faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;letter-spacing:.04em;flex:none}
.earlier{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--fg-muted);border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:11.5px;z-index:2;cursor:pointer}
.tree{overflow:auto;flex:1;padding:6px 0 12px;font-family:var(--mono);font-size:12px}
.node{display:flex;align-items:center;gap:6px;padding:3px 8px;white-space:nowrap;cursor:pointer;color:var(--fg-muted);user-select:none}
.node:hover{background:var(--panel-2)}
.node.cluster{color:var(--fg);font-family:var(--ui);font-weight:600;font-size:12.5px;padding-top:8px}
.node.ns{padding-left:18px;color:var(--fg)}
.node.pod{padding-left:46px}
.node.ctr{padding-left:70px}
.node.ctr.sel{background:var(--sel);color:var(--fg)}
.node .tw{width:10px;color:var(--fg-faint);font-size:10px}
.node .nm{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.node.gone .nm{text-decoration:line-through;opacity:.6}
.node .st{width:6px;height:6px;border-radius:50%;background:var(--live);flex:none}
.node.idle .st{background:var(--warn)}
.node.gone .st{background:var(--fg-faint)}
.node .rs{font-size:10px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:8px;padding:0 5px}
.node .cnt{font-size:10.5px;color:var(--fg-faint)}
.node input[type=checkbox]{margin:0;accent-color:var(--accent)}
.node .sw{width:8px;height:8px;border-radius:2px;background:var(--pc,transparent);flex:none}
.collapsed>.kids{display:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.q{flex:1;min-width:200px;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 8px}
.q input{flex:1;background:none;border:0;padding:6px 0;font-family:var(--mono);font-size:12.5px;min-width:0}
.q .hint{color:var(--fg-faint);font-family:var(--mono);font-size:11px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 9px;color:var(--fg-muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
.btn{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 9px;color:var(--fg-muted);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);border-color:var(--fg-faint)}
.btn.follow[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.btn.follow[aria-pressed="true"] .dot{background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.btn.follow[aria-pressed="true"] .dot{animation:none}}
.crumb{font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);padding:6px 10px 0;display:flex;gap:8px;align-items:flex-start}
.crumb .fold{flex:none;padding:1px 6px;font-size:11px;gap:4px;font-family:var(--mono)}
.crumb .cl{flex:1;min-width:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:2px}
.crumb .cl>span{white-space:nowrap}
.crumb.fold .cl{flex-wrap:nowrap;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.crumb .pc{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
.logwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.logview{flex:1;overflow:auto;font-family:var(--mono);font-size:12px;line-height:20px;position:relative;background:var(--bg)}
.spacer{position:relative;width:100%}
.rows{position:absolute;left:0;right:0;top:0}
.row{display:flex;gap:10px;padding:0 12px;white-space:pre;min-height:20px;border-left:2px solid transparent}
/* fixed-height mode is virtualised at 20 px per row: a message with embedded newlines
   (joined stack trace) must not grow the row, or the scroll height drifts and the bottom
   becomes unreachable. Newlines are shown as ⏎; Wrap mode shows them for real. */
.logview:not(.wrap) .row{height:20px;overflow:hidden}
.logview:not(.wrap) .row .msg{overflow:hidden;text-overflow:ellipsis}
.nl{color:var(--accent);opacity:.75;margin:0 3px;font-size:11px}
.row:hover{background:var(--panel-2)}
.wrap .row{white-space:pre-wrap;word-break:break-word}
.row .ts{color:var(--fg-faint);flex:none;width:96px;font-variant-numeric:tabular-nums}
.row .src{color:var(--pc,var(--fg-muted));flex:none;width:170px;overflow:hidden;text-overflow:ellipsis}
.row .msg{flex:1;min-width:0}
.row.e .msg{color:var(--stderr)}
.row.err .msg{color:var(--err)}
.row.warn .msg{color:var(--warn)}
.row.dbg .msg{color:var(--fg-muted)}
.row.multi{border-left-color:var(--pc,transparent)}
.row.sys{background:color-mix(in srgb,var(--warn) 10%,transparent)}
.row.sys .msg{color:var(--warn)}
.row.restart{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.row.restart .msg{color:var(--accent)}
.jk{color:var(--accent)}.jv{color:var(--fg)}.jn{color:var(--p4)}
.hl{background:color-mix(in srgb,var(--warn) 35%,transparent);border-radius:2px}
.tobottom{position:absolute;right:18px;bottom:34px;width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:2;display:grid;place-items:center;font-size:15px;padding:0}
.tobottom:hover{border-color:var(--accent);color:var(--accent)}
.newpill{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:4px 12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg-muted);text-align:center;padding:24px}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:6px}
.status{display:flex;gap:16px;align-items:center;padding:4px 12px;border-top:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:11px;color:var(--fg-muted);flex-wrap:wrap}
.status .drop{color:var(--warn)}
.status .errtxt{color:var(--err)}
.page{overflow:auto;padding:16px;display:none;flex-direction:column;gap:16px}
.page.on{display:flex}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .k{font-size:11px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--mono);font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11px;color:var(--fg-faint)}
.meter{height:4px;background:var(--panel-2);border-radius:2px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--ui);font-weight:500;color:var(--fg-muted);font-size:11.5px}
tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:9px;font-family:var(--ui);font-size:11px;border:1px solid var(--line)}
.pill.ok{color:var(--live)}.pill.stale{color:var(--warn)}.pill.down{color:var(--err)}
.pill .dot{background:currentColor}
h2{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.06em}
.toast{position:fixed;bottom:16px;right:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:min(360px,calc(100vw - 32px));z-index:9}
@media (max-width: 760px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:44px;bottom:0;left:0;width:min(300px,86vw);z-index:5;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.4)}
  .side.open{transform:none}
  .menubtn{display:inline-flex}
  .hubpill{display:none}
  .row .src{width:110px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="menubtn" id="menu" aria-label="Toggle stream tree">☰ Streams</button>
    <div class="brand"><span class="mark"></span>p10logs</div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-logs" aria-selected="true">Logs</button>
      <button class="tab" role="tab" id="tab-agents" aria-selected="false">Agents</button>
    </nav>
    <div class="grow"></div>
    <div class="hubpill" id="hubpill"><span class="dot"></span>connecting…</div>
    <span id="user" style="color:var(--fg-muted)"></span>
  </header>

  <div class="shell">
    <aside class="side" id="side">
      <div class="find"><input id="find" placeholder="Filter pods, workloads, labels…" aria-label="Filter pods"><button class="btn" id="refresh" title="Reload streams">↻</button></div>
      <div class="tools">
        <button class="btn sm" id="clearsel" title="Unselect all streams" disabled>✕ <span id="selcount">0</span></button>
        <button class="btn sm" id="expand" title="Expand all">⊞</button>
        <button class="btn sm" id="collapse" title="Collapse all">⊟</button>
        <button class="btn sm" id="liveonly" aria-pressed="false" title="Hide pods that no longer exist (their logs stay queryable)">live</button>
        <select id="nsfilter" aria-label="Namespace"><option value="">all namespaces</option></select>
      </div>
      <div class="chips" id="kinds" role="group" aria-label="Workload kind">
        <button data-k="" aria-pressed="true">All</button><button data-k="Deployment" aria-pressed="false">Deploy</button><button data-k="StatefulSet" aria-pressed="false">STS</button><button data-k="DaemonSet" aria-pressed="false">DS</button><button data-k="Job" aria-pressed="false">Job</button><button data-k="CronJob" aria-pressed="false">Cron</button><button data-k="Pod" aria-pressed="false">Pod</button>
      </div>
      <div class="tree" id="tree"></div>
    </aside>

    <section class="main">
      <div id="logs-page" style="display:contents">
        <div class="bar">
          <div class="q"><span class="hint">q</span><input id="q" placeholder='error !healthz "user 42" /timeout \d+ms/ level=error' aria-label="Filter lines"><span class="hint">/</span></div>
          <div class="seg" id="range">
            <button data-r="15m" aria-pressed="false">15m</button><button data-r="1h" aria-pressed="true">1h</button><button data-r="6h" aria-pressed="false">6h</button><button data-r="24h" aria-pressed="false">24h</button><button data-r="7d" aria-pressed="false">7d</button>
          </div>
          <button class="btn follow" id="follow" aria-pressed="true"><span class="dot"></span>Follow</button>
          <button class="btn" id="wrap" aria-pressed="false">Wrap</button>
          <button class="btn" id="json" aria-pressed="true">JSON</button>
          <div class="seg" id="tsmode"><button data-t="local" aria-pressed="true">Local</button><button data-t="utc" aria-pressed="false">UTC</button><button data-t="rel" aria-pressed="false">Rel</button></div>
          <a class="btn" id="export" href="#" download>Export</a>
          <button class="btn" id="link">Permalink</button>
        </div>
        <div class="crumb" id="crumb" hidden><button class="btn sm fold" id="crumbfold" aria-controls="crumbs" aria-expanded="true" title="Collapse the list of selected streams">▾ 0</button><div class="cl" id="crumbs"></div></div>
        <div class="logwrap">
          <div class="logview" id="view"><div class="spacer" id="spacer"><div class="rows" id="rows"></div></div></div>
          <button class="earlier" id="earlier" hidden>↑ earlier lines</button>
          <div class="empty" id="empty"><div><b>Pick a container on the left</b>Tail one pod, or tick several to interleave them by timestamp.</div></div>
          <button class="newpill" id="newpill" hidden>↓ 0 new lines</button>
          <button class="tobottom" id="tobottom" hidden title="Scroll to the newest line (End)" aria-label="Scroll to bottom">⤓</button>
          <div class="status">
            <span id="st-lines">0 lines</span><span id="st-scan"></span><span id="st-rate"></span><span class="drop" id="st-drop"></span><span class="errtxt" id="st-err"></span>
            <span class="grow"></span><span id="st-sel"></span>
          </div>
        </div>
      </div>

      <div class="page" id="agents-page">
        <div><h2>Hub</h2><div class="tiles" id="tiles"></div></div>
        <div><h2>Agents</h2>
          <div class="tblwrap"><table id="agents"><thead><tr><th>Node</th><th>Cluster</th><th>Status</th><th>Last push</th><th>Files</th><th>Lag</th><th>Spool</th><th>Dropped</th><th>Version</th></tr></thead><tbody></tbody></table></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const pad=(n,w=2)=>String(n).padStart(w,'0');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtB=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KiB':b<1073741824?(b/1048576).toFixed(1)+' MiB':(b/1073741824).toFixed(2)+' GiB';
const PC=['var(--p0)','var(--p1)','var(--p2)','var(--p3)','var(--p4)','var(--p5)'];
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const RANGE_MS={'15m':9e5,'1h':36e5,'6h':216e5,'24h':864e5,'7d':6048e5};
const ROWH=20;

// ---------- state ----------
const MAXBUF=10000;   // lines kept in memory while tailing; older ones are re-fetched from the hub on scroll-up
const WIN=300;        // wrap mode: rows kept in the DOM; scroll up reveals more
const PAGE=2000;      // lines per server page
const S={sel:new Set(),range:'1h',follow:true,wrap:false,json:true,ts:'local',q:'',hl:[],lines:[],view:[],head:0,lastR:{},dropped:0,pending:0,gen:0,
  streams:{},   // sid -> {cluster,ns,pod,uid,ctr,color,live,key,labels}
  tree:[],es:null,next:0,loading:false,collapsed:new Set(),autoCollapsed:new Set(),
  find:'',kinds:new Set(),ns:'',liveOnly:false,crumbFold:null}; // crumbFold: null = auto (fold when many), else user's choice
const CRUMB_FOLD_AT=8; // selected streams above this collapse the chip list to one line
let lastStart=-1,lastEnd=-1;

// ---------- API ----------
async function api(path,opts){const r=await fetch(path,opts);if(r.status===401&&!location.pathname.startsWith('/auth')){ $('st-err').textContent='unauthorized'; }
  if(!r.ok){let m=r.statusText;try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}return r.json()}

async function loadStreams(){
  try{
    const d=await api('/api/v1/streams');
    S.tree=d.clusters||[];
    for(const c of S.tree)for(const n of c.namespaces)for(const p of n.pods)for(const ct of p.containers){
      const key=`${c.name}/${n.name}/${p.name}/${ct.name}`;
      S.streams[ct.id]={cluster:c.name,ns:n.name,pod:p.name,uid:p.uid,ctr:ct.name,key:(c.hub?c.hub+':':'')+key,color:PC[hash(key)%PC.length],live:p.live&&!ct.ended,last:ct.last_ts,labels:p.labels||{}};
    }
    nsOptions();buildTree();
  }catch(e){$('st-err').textContent='streams: '+e.message}
}

// ---------- workloads ----------
// The agent attaches `_owner` = "<Kind>/<name>" when enrichment is on. Without it, guess
// from the pod name (ReplicaSet hash + 5-char suffix = Deployment, "-<digits>" = StatefulSet,
// "-<minute>-<suffix>" = CronJob, "-<nodename>" = static pod); DaemonSet and Job pods both
// end in a 5-char suffix and cannot be told apart by name alone.
const RSX=/-[bcdfghjklmnpqrstvwxz0-9]{5,10}-[bcdfghjklmnpqrstvwxz0-9]{5}$/,CRONX=/-\d{8,}-[bcdfghjklmnpqrstvwxz0-9]{5}$/,ORDX=/-\d+$/,SUFX=/-[bcdfghjklmnpqrstvwxz0-9]{5}$/;
function ownerOf(p){
  const o=(p.labels||{})._owner;if(o){const i=o.indexOf('/');return {kind:o.slice(0,i),name:o.slice(i+1),sure:true}}
  const n=p.name;

// ---------- rendering ----------

// ---------- load + live ----------
let reloadSeq=0;
async function reload(){

    $('st-scan').textContent=`· ${d.chunks} chunk${d.chunks===1?'':'s'} · ${d.ms} ms${d.truncated?' · newest '+d.lines.length.toLocaleString()+', scroll up for older':''}`;

    const now=Date.now()*1e6;
    const rows=(d.agents||[]).map(a=>({...a,hub:''}));
    const walk=(peers,prefix)=>{for(const p of peers||[]){for(const a of p.agents||[])rows.push({...a,hub:prefix+p.name});walk(p.peers,prefix+p.name+'/')}};
    walk(d.peers,'');
    const peerNote=(d.peers||[]).filter(p=>!p.ok).map(p=>p.name);if(peerNote.length)$('st-err').textContent='peer unreachable: '+peerNote.join(', ');
    $('agents').querySelector('tbody').innerHTML=rows.map(a=>{
      const age=(now-a.last_seen)/1e9;const st=age<60?'ok':age<600?'stale':'down';
      const ago=age<60?Math.floor(age)+'s':age<3600?Math.floor(age/60)+'m '+Math.floor(age%60)+'s':Math.floor(age/3600)+'h '+Math.floor(age%3600/60)+'m';
      return `<tr><td>${esc(a.node)}</td><td>${esc(a.cluster)}${a.hub?` <span class="cnt">via ${esc(a.hub)}</span>`:''}</td><td><span class="pill ${st}"><span class="dot"></span>${st==='ok'?'shipping':st==='stale'?'lagging':'no heartbeat'}</span></td><td>${ago} ago</td><td>${a.files}</td><td>${fmtB(a.lag_bytes)}</td><td>${fmtB(a.spool_bytes)}</td><td>${a.dropped?'<span style="color:var(--warn)">'+a.dropped.toLocaleString()+'</span>':'0'}</td><td>${esc(a.version||'')}</td></tr>`}).join('')||'<tr><td colspan="9" style="color:var(--fg-faint)">No agents have pushed yet.</td></tr>';
  }catch(e){$('hubpill').innerHTML=`<span class="dot bad"></span>hub unreachable`}
}

// ---------- wiring ----------
$('view').addEventListener('scroll',()=>{draw(false);bottomBtn();if($('view').scrollTop<ROWH*5)loadOlder()});
$('tobottom').addEventListener('click',()=>scrollBottom());
$('earlier').addEventListener('click',()=>{showEarlier()});
new ResizeObserver(()=>draw(true)).observe($('view'));
let qT=0;$('q').addEventListener('input',e=>{S.q=e.target.value;clearTimeout(qT);qT=setTimeout(reload,300)});
$('find').addEventListener('input',e=>{S.find=e.target.value.trim().toLowerCase();buildTree()});
$('refresh').addEventListener('click',loadStreams);
$('clearsel').addEventListener('click',()=>{S.sel.clear();reload();buildTree()});
$('expand').addEventListener('click',()=>{S.collapsed.clear();buildTree()});
$('collapse').addEventListener('click',()=>{allKeys().forEach(k=>S.collapsed.add(k));buildTree()});
$('liveonly').addEventListener('click',e=>{S.liveOnly=!S.liveOnly;e.currentTarget.setAttribute('aria-pressed',S.liveOnly);buildTree()});
$('nsfilter').addEventListener('change',e=>{S.ns=e.target.value;buildTree()});
$('kinds').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
  if(!k)S.kinds.clear();else S.kinds.has(k)?S.kinds.delete(k):S.kinds.add(k);
  [...$('kinds').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.k?S.kinds.has(x.dataset.k):!S.kinds.size));buildTree()});
$('range').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.range=b.dataset.r;[...$('range').children].forEach(x=>x.setAttribute('aria-pressed',x===b));reload()});
$('tsmode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.ts=b.dataset.t;[...$('tsmode').children].forEach(x=>x.setAttribute('aria-pressed',x===b));bump();draw(true);syncURL()});
$('follow').addEventListener('click',e=>{S.follow=!S.follow;e.currentTarget.setAttribute('aria-pressed',S.follow);if(S.follow){scrollBottom();startTail()}else stopTail();status();syncURL()});
$('wrap').addEventListener('click',e=>{S.wrap=!S.wrap;e.currentTarget.setAttribute('aria-pressed',S.wrap);$('view').classList.toggle('wrap',S.wrap);S.head=S.wrap?Math.max(0,S.view.length-WIN):0;bump();draw(true);if(S.follow)scrollBottom();syncURL()});
$('json').addEventListener('click',e=>{S.json=!S.json;e.currentTarget.setAttribute('aria-pressed',S.json);bump();draw(true);syncURL()});
$('newpill').addEventListener('click',()=>scrollBottom());
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
$('link').addEventListener('click',()=>{syncURL();const u=location.href;
  const done=()=>toast('Permalink copied');const fail=()=>toast(u);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(done,fail);else fail()});
$('menu').addEventListener('click',()=>$('side').classList.toggle('open'));
document.addEventListener('keydown',e=>{if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='SELECT')return;if(e.key==='/'){e.preventDefault();$('q').focus()}if(e.key==='End'){e.preventDefault();scrollBottom()}if(e.key==='Escape')$('side').classList.remove('open')});
function showTab(t){const logs=t==='logs';$('tab-logs').setAttribute('aria-selected',logs);$('tab-agents').setAttribute('aria-selected',!logs);$('logs-page').style.display=logs?'contents':'none';$('agents-page').classList.toggle('on',!logs);$('side').style.display=logs?'':'none';document.querySelector('.shell').classList.toggle('full',!logs);if(history.replaceState)history.replaceState(null,'',location.pathname+location.search+(logs?'#logs':'#agents'));if(logs){lastStart=-1;draw(true)}else loadStatus()}
$('tab-logs').addEventListener('click',()=>showTab('logs'));$('tab-agents').addEventListener('click',()=>showTab('agents'));

// ---------- boot ----------
(async function(){
  const u=new URLSearchParams(location.search);
  for(const id of u.getAll('sid'))S.sel.add(String(id));
  if(u.get('q')){S.q=u.get('q');$('q').value=S.q}
  if(u.get('range')&&RANGE_MS[u.get('range')]){S.range=u.get('range');[...$('range').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.r===S.range))}
  if(u.get('follow')==='false'){S.follow=false;$('follow').setAttribute('aria-pressed','false')}
  if(u.get('wrap')==='1'){S.wrap=true;$('wrap').setAttribute('aria-pressed','true');$('view').classList.add('wrap')}
  if(u.get('json')==='0'){S.json=false;$('json').setAttribute('aria-pressed','false')}
  if(u.get('ts')&&['local','utc','rel'].includes(u.get('ts'))){S.ts=u.get('ts');[...$('tsmode').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.t===S.ts))}
  try{const me=await api('/auth/me');$('user').textContent=me.user||'';
    if(me.mode==='oidc')$('user').innerHTML=`${esc(me.user)} · <a href="/auth/logout">logout</a>`;
    else if(me.mode==='basic')$('user').innerHTML=`${esc(me.user)}${me.local?' · <a href="/auth/password">password</a>':''} · <a href="/auth/logout">logout</a>`}catch(e){}
  await loadStreams();
  if(location.hash==='#agents')showTab('agents');
  loadStatus();setInterval(loadStatus,5000);setInterval(loadStreams,30000);
  if(S.sel.size)reload();
})();
</script>
</body>
</html>
