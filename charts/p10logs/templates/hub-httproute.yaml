{{- if and .Values.hub.enabled .Values.hub.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "p10logs.hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "p10logs.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  parentRefs:
    {{- toYaml .Values.hub.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.hub.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "p10logs.hub.fullname" . }}
          port: {{ .Values.hub.service.port }}
{{- end }}
