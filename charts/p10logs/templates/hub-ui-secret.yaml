{{- /* Only when a password is given explicitly. Without one the hub starts with admin/admin and asks for a new password on first login. */ -}}
{{- if and .Values.hub.enabled (eq .Values.hub.auth.ui.mode "basic") (not .Values.hub.auth.ui.basic.existingSecret) .Values.hub.auth.ui.basic.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "p10logs.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "p10logs.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ .Values.hub.auth.ui.basic.username | b64enc | quote }}
  password: {{ include "p10logs.uiPassword" . | b64enc | quote }}
{{- end }}
