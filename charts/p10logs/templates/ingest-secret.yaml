{{- /* Shared ingest token. Created unless user supplies existingSecret. */ -}}
{{- if and (not .Values.hub.auth.existingSecret) (not .Values.agent.hub.existingSecret) (or .Values.agent.enabled .Values.hub.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "p10logs.ingestSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "p10logs.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- $tok := include "p10logs.ingestToken" . }}
data:
  token: {{ $tok | b64enc | quote }}
  ingest-token: {{ $tok | b64enc | quote }}
{{- end }}
