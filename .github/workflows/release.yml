name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - id: v
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.ver }}
          tags: ghcr.io/p10node/p10logs-agent:${{ steps.v.outputs.ver }},ghcr.io/p10node/p10logs-agent:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.ver }}
          tags: ghcr.io/p10node/p10logs-hub:${{ steps.v.outputs.ver }},ghcr.io/p10node/p10logs-hub:latest
  chart:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - id: v
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: |
          sed -i "s/^version:.*/version: ${{ steps.v.outputs.ver }}/; s/^appVersion:.*/appVersion: \"${{ steps.v.outputs.ver }}\"/" charts/p10logs/Chart.yaml
          helm package charts/p10logs -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push dist/p10logs-${{ steps.v.outputs.ver }}.tgz oci://ghcr.io/p10node/charts
      - uses: softprops/action-gh-release@v2
        with: { files: dist/*.tgz, generate_release_notes: true }
