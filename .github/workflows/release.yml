name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      agent_digest: ${{ steps.agent.outputs.digest }}
      hub_digest: ${{ steps.hub.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # sbom + provenance attach an SPDX SBOM and SLSA provenance to each image index;
      # `docker buildx imagetools inspect` and Artifact Hub show them.
      - id: agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: VERSION=${{ steps.v.outputs.ver }}
          tags: |
            ghcr.io/p10node/p10logs-agent:${{ steps.v.outputs.ver }}
            ghcr.io/p10node/p10logs-agent:latest
      - id: hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: VERSION=${{ steps.v.outputs.ver }}
          tags: |
            ghcr.io/p10node/p10logs-hub:${{ steps.v.outputs.ver }}
            ghcr.io/p10node/p10logs-hub:latest
      - name: sign the images (cosign keyless, GitHub OIDC)
        env:
          AGENT: ${{ steps.agent.outputs.digest }}
          HUB: ${{ steps.hub.outputs.digest }}
        run: |
          test -n "$AGENT" && test -n "$HUB"
          cosign sign --yes "ghcr.io/p10node/p10logs-agent@$AGENT"
          cosign sign --yes "ghcr.io/p10node/p10logs-hub@$HUB"
  chart:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: oras-project/setup-oras@v1
      - uses: sigstore/cosign-installer@v3
      - id: v
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: package and push the chart
        id: push
        env:
          VER: ${{ steps.v.outputs.ver }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          sed -i "s/^version:.*/version: $VER/; s/^appVersion:.*/appVersion: \"$VER\"/" charts/p10logs/Chart.yaml
          helm package charts/p10logs -d dist
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/p10logs-$VER.tgz" oci://ghcr.io/p10node/charts 2>&1 | tee push.log
          echo "digest=$(sed -n 's/^Digest: //p' push.log)" >> "$GITHUB_OUTPUT"
      - name: sign the chart (cosign keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$DIGEST"
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "ghcr.io/p10node/charts/p10logs@$DIGEST"
      - name: push Artifact Hub repository metadata (verified publisher)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/p10node/charts/p10logs:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/p10logs/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
          body: |
            Images and chart are signed with cosign (keyless, GitHub Actions OIDC) and the
            images carry an SPDX SBOM and SLSA provenance. Verify:

            ```
            cosign verify ghcr.io/p10node/p10logs-hub:${{ steps.v.outputs.ver }} \
              --certificate-identity-regexp='^https://github.com/p10node/p10logs/' \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            ```
            Agent digest: `${{ needs.images.outputs.agent_digest }}`
            Hub digest: `${{ needs.images.outputs.hub_digest }}`
