name: docs
on:
  push:
    branches: [main]
    paths: [docs/**, README.md, CHANGELOG.md, mkdocs.yml]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: pip install mkdocs-material
      - run: sed 's#(docs/#(#g' README.md > docs/index.md && cp CHANGELOG.md docs/CHANGELOG.md   # README links docs/… ; inside the site they are relative to docs/
      - run: mkdocs gh-deploy --force
